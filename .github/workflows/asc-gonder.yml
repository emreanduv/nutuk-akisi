name: App Store incelemeye gönder (Nutuk Salonu)
# Yalnız Emre "gönder" dediğinde çalıştırılır: içerik hakları beyanı + sürümü incelemeye gönderir.
on:
  workflow_dispatch:
    inputs:
      surum: { description: "App Store sürümü", default: "1.2.3" }
permissions:
  contents: write
env:
  ASC_KEY_ID: DJSHKK6T3P
  ASC_ISSUER_ID: f4943ef8-df6f-42c8-a561-58554097ea35
jobs:
  gonder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Yayın öncesi kontrol
        run: sh araclar/yayin-kontrol.sh "${{ inputs.surum }}"
      - name: Anahtar
        env: { P8: "${{ secrets.ASC_KEY_P8 }}" }
        run: mkdir -p ~/private_keys && printf '%s' "$P8" > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
      - run: pip3 install --quiet pyjwt cryptography
      - name: Gönder
        env: { SURUM: "${{ inputs.surum }}" }
        run: python3 araclar/asc_gonder.py
      - name: Durumu asc-durum dalına yaz
        if: always()
        run: |
          mkdir -p /tmp/d && cp durum.json /tmp/d/ 2>/dev/null || echo '{}' > /tmp/d/durum.json; cd /tmp/d
          git init -q -b asc-durum && git config user.name "github-actions" && git config user.email "actions@github.com"
          git add . && git commit -qm "ASC gönder durum" && git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" asc-durum
